name: Build Windows x64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build Release x64
        run: |
          msbuild Injector.sln `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /m `
            /verbosity:normal

      - name: Verify executable
        run: |
          if (Test-Path "bin\Release\Injector.exe") {
            Write-Host "SUCCESS: Injector.exe found"
            Get-Item "bin\Release\Injector.exe" | Select-Object Name, Length, LastWriteTime
          } else {
            Write-Error "FAIL: Injector.exe not found"
            Get-ChildItem -Recurse -Filter "*.exe" | Select-Object FullName
            exit 1
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Injector-x64-Release
          path: bin\Release\Injector.exe
          if-no-files-found: error
          retention-days: 30
